<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="一只小鲨鱼">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FDCF7" />
      <stop offset="0.5" stop-color="#4AA8DA" />
      <stop offset="1" stop-color="#2C7CAC" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63BCE8" />
      <stop offset="1" stop-color="#2A76A4" />
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="205" cy="330" rx="120" ry="13" fill="#0E3A52" opacity="0.12" />

  <!-- 尾鳍 -->
  <path d="M104 205 C78 176 46 152 26 146 C40 178 50 194 52 205 C50 216 40 232 26 264 C46 258 78 234 104 205 Z"
        fill="url(#finGrad)" stroke="#1B5E86" stroke-width="3" stroke-linejoin="round" />

  <!-- 背鳍 -->
  <path d="M214 152 C220 120 244 100 268 92 C262 112 262 132 261 154 Z"
        fill="url(#finGrad)" stroke="#1B5E86" stroke-width="3" stroke-linejoin="round" />

  <!-- 主身体 -->
  <path d="M368 206 C350 170 300 150 240 148 C178 146 128 168 104 205 C128 242 180 266 244 266 C300 266 350 242 368 206 Z"
        fill="url(#bodyGrad)" stroke="#1B5E86" stroke-width="3" stroke-linejoin="round" />

  <!-- 白色腹部 -->
  <path d="M104 205 C128 242 180 266 244 266 C300 266 350 242 368 206 C334 238 284 250 232 250 C176 250 130 232 104 205 Z"
        fill="#F4FBFF" stroke="none" />

  <!-- 胸鳍 -->
  <path d="M238 258 C236 282 250 302 272 314 C268 292 266 274 266 258 Z"
        fill="url(#finGrad)" stroke="#1B5E86" stroke-width="3" stroke-linejoin="round" />

  <!-- 鳃裂 -->
  <path d="M280 188 C275 199 275 212 280 223" fill="none" stroke="#1B5E86" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M292 186 C287 199 287 213 292 225" fill="none" stroke="#1B5E86" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M304 186 C299 199 299 213 304 225" fill="none" stroke="#1B5E86" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- 眼睛 -->
  <circle cx="322" cy="190" r="16" fill="#FFFFFF" stroke="#1B5E86" stroke-width="3" />
  <circle cx="325" cy="191" r="8" fill="#12324A" />
  <circle cx="321" cy="186" r="3" fill="#FFFFFF" />

  <!-- 嘴 -->
  <path d="M320 224 C334 237 353 235 365 218" fill="none" stroke="#1B5E86" stroke-width="3.5" stroke-linecap="round" />

  <!-- 脸颊腮红 -->
  <ellipse cx="303" cy="216" rx="10" ry="6" fill="#FF9BA8" opacity="0.55" />

  <!-- 喷出来的小水泡 -->
  <circle cx="352" cy="170" r="6" fill="#D6F0FF" stroke="#1B5E86" stroke-width="2" opacity="0.9" />
  <circle cx="366" cy="152" r="4" fill="#D6F0FF" stroke="#1B5E86" stroke-width="2" opacity="0.8" />
</svg>
